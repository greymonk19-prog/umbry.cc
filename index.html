<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Umbry.cc</title>
  <style>
    /* Page reset and background */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* Smooth, simplistic text */
    .message {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.7);
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }

    /* Fade-in animation on load/reload */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="message">
    Umbry.cc will be up and running with a completely new look soon
  </div>
</body>
</html>
