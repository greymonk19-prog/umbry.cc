<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Umbry's Dungeon</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #0b0b0b;
            color: white;
            font-family: "Exo 2", sans-serif;
        }

        .top-bar {
            height: 60px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #222;
        }

        .title {
            font-size: 24px;
            letter-spacing: 1px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.85;
        }

        .nav-btn:hover {
            opacity: 1;
        }

        .content {
            padding: 40px;
        }

        .about {
            display: none;
            align-items: flex-start;
            gap: 30px;
        }

        .about.show {
            display: flex;
        }

        .pfp {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            border: 2px solid #222;
        }

        .about-text h1 {
            margin: 0;
            font-size: 48px;
            letter-spacing: 2px;
        }

        .about-text p {
            margin-top: 12px;
            font-size: 18px;
            line-height: 1.5;
            opacity: 0.85;
        }

        .socials {
            margin-top: 30px;
        }

        .socials h2 {
            margin-bottom: 12px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            text-decoration: none;
            color: white;
            opacity: 0.85;
        }

        .social-link:hover {
            opacity: 1;
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: white;
        }
    </style>
</head>
<body>

<div id="site">
    <div class="top-bar">
        <div class="title">Umbry's Dungeon</div>
        <button class="nav-btn" onclick="toggleAbout()">About Me</button>
    </div>

    <div class="content">
        <div id="about" class="about">
            <img class="pfp"
                 src="https://cdn.discordapp.com/avatars/1409311623965048862/2f1444ba72da10d223824e743ad9ffed.png?size=1024"
                 alt="umbry profile picture">

            <div class="about-text">
                <h1>FANDSS</h1>
                <p>
                    bradar wat is tis?
                </p>
        </div>
    </div>
</div>

<script>
function toggleAbout() {
    document.getElementById("about").classList.toggle("show");
}
toggleAbout()
 
</script>
</body>
</html>
