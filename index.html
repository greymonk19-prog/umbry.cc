<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Umbry.cc</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    .message {
      font-size: 3rem;              /* Bigger text */
      font-weight: 600;             /* Thicker text */
      letter-spacing: 0.03em;
      text-align: center;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.85);
      opacity: 0;
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="message">
    Umbry.cc will be up and running with a completely new look soon
  </div>
</body>
</html>
