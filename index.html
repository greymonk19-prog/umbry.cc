<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Monochrome Services</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
  }

  header {
    padding: 30px 20px;
    text-align: center;
    border-bottom: 1px solid #111;
  }

  header h1 {
    font-size: 26px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  header p {
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    padding: 30px;
    max-width: 1200px;
    margin: auto;
  }

  .item {
    background: #0a0a0a;
    border: 1px solid #111;
    padding: 20px;
    border-radius: 10px;
    transition: 0.25s ease;
    cursor: pointer;
  }

  .item:hover {
    transform: scale(1.03);
    box-shadow: 0 0 25px rgba(255,255,255,0.08);
    border-color: #333;
  }

  .item img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .item h3 {
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .item p {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 10px;
  }

  .price {
    font-size: 15px;
    font-weight: bold;
  }

  .cart {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #111;
    padding: 10px 16px;
    border-radius: 50px;
    border: 1px solid #222;
    cursor: pointer;
    transition: 0.2s ease;
  }

  .cart:hover {
    background: #222;
  }

  .cart span {
    font-size: 13px;
    letter-spacing: 0.1em;
  }

  .cart-count {
    background: #fff;
    color: #000;
    padding: 2px 7px;
    border-radius: 50px;
    margin-left: 8px;
    font-size: 12px;
    font-weight: bold;
  }

  /* Cart panel */
  #cartPanel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 350px;
    height: 100%;
    background: #0a0a0a;
    border-left: 1px solid #111;
    padding: 20px;
    transition: 0.35s ease;
    overflow-y: auto;
  }

  #cartPanel.open {
    right: 0;
  }

  #cartPanel h2 {
    font-size: 18px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .cart-item {
    border-bottom: 1px solid #111;
    padding: 12px 0;
  }

  .cart-item-title {
    font-size: 14px;
    letter-spacing: 0.1em;
  }

  .cart-item-price {
    opacity: 0.7;
    font-size: 13px;
  }

  .remove-btn {
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.6;
    cursor: pointer;
  }

  .remove-btn:hover {
    opacity: 1;
  }
</style>
</head>

<body>

<header>
  <h1>Monochrome Services</h1>
  <p>Luxury marketplace</p>
</header>

<div class="cart" id="cartBtn">
  <span>Cart</span>
  <span class="cart-count" id="cartCount">0</span>
</div>

<div id="cartPanel">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
</div>

<div class="grid" id="productGrid"></div>

<script>
  const products = [
    { id: 1, name: "Luxury Monogram Tote", price: 45, img: "https://via.placeholder.com/300x200?text=Bag" },
    { id: 2, name: "Premium Leather Crossbody", price: 38, img: "https://via.placeholder.com/300x200?text=Crossbody" },
    { id: 3, name: "Designer-Style Sneakers", price: 55, img: "https://via.placeholder.com/300x200?text=Sneakers" },
    { id: 4, name: "Minimal Street Hoodie", price: 30, img: "https://via.placeholder.com/300x200?text=Hoodie" },
    { id: 5, name: "Luxury Sunglasses", price: 22, img: "https://via.placeholder.com/300x200?text=Sunglasses" },
    { id: 6, name: "Premium Leather Wallet", price: 18, img: "https://via.placeholder.com/300x200?text=Wallet" },
    { id: 7, name: "Monogram Shoulder Bag", price: 42, img: "https://via.placeholder.com/300x200?text=Bag" },
    { id: 8, name: "Streetwear Cargo Pants", price: 28, img: "https://via.placeholder.com/300x200?text=Cargos" },
    { id: 9, name: "Luxury Travel Duffel", price: 60, img: "https://via.placeholder.com/300x200?text=Duffel" }
  ];

  const grid = document.getElementById("productGrid");
  const cartBtn = document.getElementById("cartBtn");
  const cartPanel = document.getElementById("cartPanel");
  const cartCount = document.getElementById("cartCount");
  const cartItems = document.getElementById("cartItems");

  let cart = [];

  function renderProducts() {
    grid.innerHTML = "";
    products.forEach(p => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">£${p.price}</p>
      `;
      item.onclick = () => addToCart(p);
      grid.appendChild(item);
    });
  }

  function addToCart(product) {
    cart.push(product);
    updateCart();
  }

  function updateCart() {
    cartCount.textContent = cart.length;
    cartItems.innerHTML = "";

    cart.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "cart-item";
      div.innerHTML = `
        <div class="cart-item-title">${item.name}</div>
        <div class="cart-item-price">£${item.price}</div>
        <div class="remove-btn" onclick="removeItem(${index})">Remove</div>
      `;
      cartItems.appendChild(div);
    });
  }

  function removeItem(i) {
    cart.splice(i, 1);
    updateCart();
  }

  cartBtn.onclick = () => {
    cartPanel.classList.toggle("open");
  };

  renderProducts();
</script>

</body>
</html>
