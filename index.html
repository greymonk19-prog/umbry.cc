<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Monochrome Services</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    scroll-behavior: smooth;
  }

  header {
    padding: 30px 20px 10px;
    text-align: center;
    border-bottom: 1px solid #111;
  }

  header h1 {
    font-size: 26px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  header p {
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* NAVIGATION */
  nav {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 15px 0;
    border-bottom: 1px solid #111;
  }

  nav a {
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.6;
    transition: 0.2s ease;
  }

  nav a:hover {
    opacity: 1;
  }

  /* SECTION TITLES */
  .section-title {
    text-align: center;
    margin-top: 40px;
    margin-bottom: 20px;
    font-size: 18px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.9;
  }

  /* PRODUCT GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
  }

  .item {
    background: #0a0a0a;
    border: 1px solid #111;
    padding: 20px;
    border-radius: 10px;
    transition: 0.25s ease;
    cursor: pointer;
  }

  .item:hover {
    transform: scale(1.03);
    box-shadow: 0 0 25px rgba(255,255,255,0.08);
    border-color: #333;
  }

  .item img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .item h3 {
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .price {
    font-size: 15px;
    font-weight: bold;
  }

  /* CART BUTTON */
  .cart {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #111;
    padding: 10px 16px;
    border-radius: 50px;
    border: 1px solid #222;
    cursor: pointer;
    transition: 0.2s ease;
    z-index: 999;
  }

  .cart:hover {
    background: #222;
  }

  .cart-count {
    background: #fff;
    color: #000;
    padding: 2px 7px;
    border-radius: 50px;
    margin-left: 8px;
    font-size: 12px;
    font-weight: bold;
  }

  /* CART PANEL */
  #cartPanel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 350px;
    height: 100%;
    background: #0a0a0a;
    border-left: 1px solid #111;
    padding: 20px;
    transition: 0.35s ease;
    overflow-y: auto;
    z-index: 999;
  }

  #cartPanel.open {
    right: 0;
  }

  #cartPanel h2 {
    font-size: 18px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .cart-item {
    border-bottom: 1px solid #111;
    padding: 12px 0;
  }

  .remove-btn {
    margin-top: 6px;
    font-size: 11px;
    opacity: 0.6;
    cursor: pointer;
  }

  .remove-btn:hover {
    opacity: 1;
  }
</style>
</head>

<body>

<header>
  <h1>Monochrome Services</h1>
  <p>Luxury marketplace</p>
</header>

<nav>
  <a href="#bags">Bags</a>
  <a href="#footwear">Footwear</a>
  <a href="#clothes">Clothes</a>
  <a href="#accessories">Accessories</a>
</nav>

<div class="cart" id="cartBtn">
  Cart <span class="cart-count" id="cartCount">0</span>
</div>

<div id="cartPanel">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
</div>

<!-- BAGS -->
<h2 class="section-title" id="bags">Bags</h2>
<div class="grid" id="bagsGrid"></div>

<!-- FOOTWEAR -->
<h2 class="section-title" id="footwear">Footwear</h2>
<div class="grid" id="footwearGrid"></div>

<!-- CLOTHES -->
<h2 class="section-title" id="clothes">Clothes</h2>
<div class="grid" id="clothesGrid"></div>

<!-- ACCESSORIES -->
<h2 class="section-title" id="accessories">Accessories</h2>
<div class="grid" id="accessoriesGrid"></div>

<script>
  const products = {
    bags: [
      { name: "Luxury Monogram Tote", price: 45, img: "https://via.placeholder.com/300x200?text=Tote" },
      { name: "Premium Leather Crossbody", price: 38, img: "https://via.placeholder.com/300x200?text=Crossbody" },
      { name: "Monogram Shoulder Bag", price: 42, img: "https://via.placeholder.com/300x200?text=Bag" }
    ],
    footwear: [
      { name: "Designer-Style Sneakers", price: 55, img: "https://via.placeholder.com/300x200?text=Sneakers" },
      { name: "Minimal Street Runners", price: 48, img: "https://via.placeholder.com/300x200?text=Runners" }
    ],
    clothes: [
      { name: "Minimal Street Hoodie", price: 30, img: "https://via.placeholder.com/300x200?text=Hoodie" },
      { name: "Streetwear Cargo Pants", price: 28, img: "https://via.placeholder.com/300x200?text=Cargos" }
    ],
    accessories: [
      { name: "Luxury Sunglasses", price: 22, img: "https://via.placeholder.com/300x200?text=Sunglasses" },
      { name: "Premium Leather Wallet", price: 18, img: "https://via.placeholder.com/300x200?text=Wallet" }
    ]
  };

  const cart = [];
  const cartCount = document.getElementById("cartCount");
  const cartItems = document.getElementById("cartItems");
  const cartPanel = document.getElementById("cartPanel");

  function renderSection(section, elementId) {
    const grid = document.getElementById(elementId);
    grid.innerHTML = "";

    products[section].forEach((p, index) => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">£${p.price}</p>
      `;
      item.onclick = () => addToCart(p);
      grid.appendChild(item);
    });
  }

  function addToCart(product) {
    cart.push(product);
    updateCart();
  }

  function updateCart() {
    cartCount.textContent = cart.length;
    cartItems.innerHTML = "";

    cart.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "cart-item";
      div.innerHTML = `
        <div>${item.name}</div>
        <div>£${item.price}</div>
        <div class="remove-btn" onclick="removeItem(${index})">Remove</div>
      `;
      cartItems.appendChild(div);
    });
  }

  function removeItem(i) {
    cart.splice(i, 1);
    updateCart();
  }

  document.getElementById("cartBtn").onclick = () => {
    cartPanel.classList.toggle("open");
  };

  renderSection("bags", "bagsGrid");
  renderSection("footwear", "footwearGrid");
  renderSection("clothes", "clothesGrid");
  renderSection("accessories", "accessoriesGrid");
</script>

</body>
</html>
