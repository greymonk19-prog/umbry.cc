<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>rosé’s gfx commissions</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom, #ffffff, #ffe4f4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SHOWCASE BUTTON */
    .showcase-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(to right, #ffb3d6, #ff8fb8);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(255, 143, 184, 0.4);
      transition: 0.2s ease;
    }

    .showcase-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 143, 184, 0.5);
    }

    /* PRICING BUTTON (TOP LEFT) */
    .pricing-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(to right, #ffb3d6, #ff8fb8);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(255, 143, 184, 0.4);
      transition: 0.2s ease;
    }

    .pricing-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 143, 184, 0.5);
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      max-width: 700px;
      width: 90%;
      padding: 24px 28px 30px;
      border: 1px solid #ffd1ec;
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .lotus {
      width: 120px;
      margin: 0 auto 10px;
      display: block;
    }

    .title {
      font-family: "Pacifico", cursive;
      font-size: 2.4rem;
      text-align: center;
      color: #ff8fb8;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ffe4f4;
      color: #ff4f9a;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ff4f9a;
      margin: 18px 0 8px;
      text-align: left;
    }

    .question { margin-bottom: 16px; text-align: left; }

    .question-label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid #ffc1e4;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s ease;
      background: #fff;
    }

    input:focus, textarea:focus {
      border-color: #ff8fb8;
      box-shadow: 0 0 0 2px rgba(255, 143, 184, 0.25);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .option-pill {
      position: relative;
    }

    .option-pill input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .option-pill label {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid #ffc1e4;
      font-size: 0.85rem;
      cursor: pointer;
      background: #fff;
      color: #444;
      transition: 0.2s ease;
    }

    .option-pill input:checked + label {
      background: #ff8fb8;
      color: #fff;
      border-color: #ff8fb8;
      box-shadow: 0 4px 10px rgba(255, 143, 184, 0.4);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .submit-btn {
      border: none;
      padding: 9px 18px;
      border-radius: 999px;
      background: linear-gradient(to right, #ff8fb8, #ff4f9a);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255, 79, 154, 0.4);
      transition: 0.2s ease;
      width: 100%;
      margin-top: 20px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(255, 79, 154, 0.5);
    }

    /* TOS BUTTON */
    .tos-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(to right, #ffb3d6, #ff8fb8);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(255, 143, 184, 0.4);
      transition: 0.2s ease;
    }

    .tos-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 143, 184, 0.5);
    }

    .char-count {
      font-size: 0.75rem;
      color: #777;
      text-align: right;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- SHOWCASE BUTTON -->
  <a class="showcase-btn" href="https://umbry.cc/showcase">showcase</a>

  <!-- PRICING BUTTON -->
  <a class="pricing-btn" href="https://umbry.cc/pricing">pricing</a>

  <div class="container">

    <!-- LOTUS IMAGE -->
    <img class="lotus" src="https://png.pngtree.com/png-vector/20260510/ourmid/pngtree-pink-lotus-flower-in-full-bloom-with-delicate-petals-png-image_19273100.webp" alt="lotus">

    <div class="pill">✨ order your dream gfx ✨</div>
    <h1 class="title">rosé’s gfx commissions</h1>
    <p class="subtitle">this is where you order my commissions — be as detailed and creative as you want! 🌸</p>

    <!-- TYPE -->
    <div class="section-title">commission type</div>
    <div class="question">
      <span class="question-label">Advanced or Basic?</span>
      <div class="options">
        <div class="option-pill">
          <input type="radio" name="type" id="advanced" value="Advanced">
          <label for="advanced">Advanced</label>
        </div>
        <div class="option-pill">
          <input type="radio" name="type" id="basic" value="Basic">
          <label for="basic">Basic</label>
        </div>
      </div>
    </div>

    <!-- CONTACT -->
    <div class="section-title">contact info</div>
    <div class="row">
      <div class="question">
        <label class="question-label">Discord</label>
        <input type="text" id="discord">
      </div>

      <div class="question">
        <label class="question-label">Roblox Username</label>
        <input type="text" id="roblox">
      </div>
    </div>

    <!-- VISUAL -->
    <div class="section-title">visual details</div>

    <div class="question">
      <label class="question-label">Main Colours</label>
      <input type="text" id="main-colours">
    </div>

    <div class="question">
      <label class="question-label">Theme / Vibe</label>
      <input type="text" id="theme">
    </div>

    <div class="question">
      <label class="question-label">Pose / Expression</label>
      <input type="text" id="pose">
    </div>

    <div class="question">
      <label class="question-label">Background</label>
      <input type="text" id="background">
    </div>

    <!-- EXTRA -->
    <div class="section-title">extra info</div>

    <div class="question">
      <label class="question-label">Text on GFX</label>
      <input type="text" id="text">
    </div>

    <div class="question">
      <label class="question-label">Extra Details</label>
      <textarea id="details" maxlength="400"></textarea>
      <div class="char-count" id="char-count">0 / 400 characters</div>
    </div>

    <div class="row">
      <div class="question">
        <label class="question-label">Deadline</label>
        <input type="text" id="deadline">
      </div>

      <div class="question">
        <label class="question-label">Timezone</label>
        <input type="text" id="timezone">
      </div>
    </div>

    <button class="submit-btn" onclick="submitForm()">send commission request ✨</button>

    <!-- TOS BUTTON -->
    <a class="tos-btn" href="https://umbry.cc/tos">terms of service</a>

  </div>

  <script>
    // character counter
    const details = document.getElementById("details");
    const charCount = document.getElementById("char-count");

    details.addEventListener("input", () => {
      charCount.textContent = `${details.value.length} / ${details.maxLength} characters`;
    });

    // submit + redirect
    function submitForm() {
      const type = document.querySelector('input[name="type"]:checked')?.value || "Not specified";
      const discord = document.getElementById("discord").value;
      const roblox = document.getElementById("roblox").value;
      const colours = document.getElementById("main-colours").value;
      const theme = document.getElementById("theme").value;
      const pose = document.getElementById("pose").value;
      const background = document.getElementById("background").value;
      const gfxtext = document.getElementById("text").value;
      const detailsText = document.getElementById("details").value;
      const deadline = document.getElementById("deadline").value;
      const timezone = document.getElementById("timezone").value;

      const paragraph =
        `Commission Request:\n\n` +
        `• Type: ${type}\n` +
        `• Discord: ${discord}\n` +
        `• Roblox Username: ${roblox}\n\n` +
        `• Main Colours: ${colours}\n` +
        `• Theme / Vibe: ${theme}\n` +
        `• Pose / Expression: ${pose}\n` +
        `• Background: ${background}\n\n` +
        `• Text on GFX: ${gfxtext}\n\n` +
        `Extra Details:\n${detailsText}\n\n` +
        `• Deadline: ${deadline}\n` +
        `• Timezone: ${timezone}\n\n` +
        `Please DM Bucketey on Discord and paste this message.`;

      const encoded = encodeURIComponent(paragraph);

      window.location.href = `https://umbry.cc/dm?data=${encoded}`;
    }
  </script>

</body>
</html>
