<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>rosé’s gfx showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom, #ffffff, #ffe4f4);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      max-width: 900px;
      width: 100%;
      padding: 30px;
      border: 1px solid #ffd1ec;
      backdrop-filter: blur(6px);
      text-align: center;
    }

    .title {
      font-family: "Pacifico", cursive;
      font-size: 2.6rem;
      color: #ff8fb8;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #555;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #ff4f9a;
      margin: 25px 0 10px;
      text-align: left;
    }

    .gfx-box {
      background: #fff;
      border: 1px solid #ffc1e4;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 6px 16px rgba(255, 143, 184, 0.25);
    }

    .gfx-box img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .gfx-label {
      font-size: 1rem;
      font-weight: 600;
      color: #ff4f9a;
    }

    .back-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(to right, #ffb3d6, #ff8fb8);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(255, 143, 184, 0.4);
      transition: 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(255, 143, 184, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">

    <h1 class="title">rosé’s gfx showcase</h1>
    <p class="subtitle">a collection of my finished gfx work — advanced & basic ✨</p>

    <!-- ADVANCED -->
    <div class="section-title">advanced gfx</div>
    <div class="gfx-box">
      <img src="https://raw.githubusercontent.com/greymonk19-prog/umbry.cc/main/first%20gfx%20advanced.png" alt="advanced gfx">
      <div class="gfx-label">advanced — snow gfx</div>
    </div>

    <!-- BASIC -->
    <div class="section-title">basic gfx</div>
    <div class="gfx-box">
      <img src="https://raw.githubusercontent.com/greymonk19-prog/umbry.cc/main/winterrr.png" alt="basic gfx">
      <div class="gfx-label">basic — winter gfx</div>
    </div>

    <a class="back-btn" href="https://umbry.cc">← back to commissions</a>

  </div>

</body>
</html>
